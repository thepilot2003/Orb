name: Build Orb

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build macOS Application
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Orb (Release)
        run: |
          xcodebuild -project Orb.xcodeproj \
            -scheme Orb \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            clean build CODE_SIGNING_ALLOWED=NO
